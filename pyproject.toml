[project]
name = "menlo-sdk"
dynamic = ["version"]
description = "Drive an Asimov robot from Python: one Robot, pluggable transports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Menlo Research" }]
keywords = ["robotics", "asimov", "humanoid", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Two runtime dependencies. `asimov-protocol` is the generated asimov.io bindings, from
# PyPI: its MAJOR tracks the wire directory (v1/) the SDK speaks, hence `<2`; its MINOR
# is an additive schema change, hence the floor at the line the edge runs. The floor
# names the rc explicitly while that is all PyPI has: pip and uv refuse a pre-release
# for a plain `>=1.2` floor, and accept it when the specifier itself spells one. Tighten
# to `>=1.2.1` once the final is out. `protobuf`'s floor matches the gencode's
# ValidateProtobufRuntimeVersion (plugin v29.3).
dependencies = [
    "asimov-protocol>=1.2.1rc1,<2",
    "protobuf>=5.29.3",
]

# The media lane is an EXTRA on purpose: `pip install menlo-sdk` with no extra drives a
# robot over UDP, and every `livekit` import in the SDK is lazy and lives in one module
# (src/menlo/asimov/transport/_livekit_client.py).
[project.optional-dependencies]
livekit = ["livekit>=1.1.4,<2"]  # 1.1.4: first release with data tracks (the state carrier)

[project.scripts]
menlo = "menlo.cli:main"

[project.urls]
Homepage = "https://github.com/menloresearch/menlo-sdk"
Documentation = "https://github.com/menloresearch/menlo-sdk/blob/main/docs/REFERENCE.md"
Repository = "https://github.com/menloresearch/menlo-sdk"
Issues = "https://github.com/menloresearch/menlo-sdk/issues"
Changelog = "https://github.com/menloresearch/menlo-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-protobuf>=5.29",
    "packaging>=24",  # test_proto_source checks the installed protocol against the declared line
    "pillow>=10",  # Frame.to_jpeg / Clip.save_frames are tested; the SDK itself never imports it
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/menlo/__init__.py"

# Core metadata pinned to 2.4: hatchling >= 1.32 writes 2.5, which the twine inside
# pypa/gh-action-pypi-publish < 1.14.2 (and any older tooling) rejects as unknown.
[tool.hatch.build.targets.wheel]
packages = ["src/menlo"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = [
    "PLR0913",  # verbs take a handful of keyword args by design
    "PLR2004",  # magic numbers in tests and wire constants are named in comments
    "PLR0912",  # the wait loop is one function on purpose
    "PLR0915",
    "PLR0911",
    "PLC0415",  # lazy imports are deliberate: protobuf loads when a transport opens, not at import
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011", "RUF012"]
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/menlo"]

[[tool.mypy.overrides]]
module = ["asimov_protocol.*", "numpy", "livekit.*", "cv2", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --timeout=60"
markers = [
    "integration: needs an asimov-edge checkout (ASIMOV_EDGE_SRC); drives the real UdpConnector in-process",
    "live: needs a running robot or studio rig (MENLO_SDK_LIVE_HOST)",
    "livekit: needs the livekit extra and a LiveKit server (`livekit-server --dev`, or MENLO_SDK_LIVEKIT_URL)",
]
